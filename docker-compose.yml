version: "3.8"

services:
  netstream:
    image: netstream/netstream:latest
    container_name: netstream
    restart: unless-stopped
    ports:
      - "8096:8096"
      - "8920:8920"
    volumes:
      - netstream-config:/config
      - netstream-cache:/cache
      - ~/media:/media:ro
    environment:
      - TZ=UTC
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  netstream-config:
  netstream-cache:
