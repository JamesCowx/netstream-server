<svg xmlns="http://www.w3.org/2000/svg" width="420" height="100" viewBox="0 0 420 100" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="45%" stop-color="#0090ff"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </linearGradient>
    <linearGradient id="g3" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow1" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow2" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowText" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="bgClip">
      <rect x="0" y="0" width="420" height="100" rx="12"/>
    </clipPath>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.5" fill="#ffffff" opacity="0.04"/>
    </pattern>
    <style>
      @keyframes pulse1 { 0%,100%{opacity:.3} 50%{opacity:.9} }
      @keyframes pulse2 { 0%,100%{opacity:.2} 50%{opacity:.7} }
      @keyframes orbit1 { from{transform:rotate(0)} to{transform:rotate(360deg)} }
      @keyframes orbit2 { from{transform:rotate(0)} to{transform:rotate(-360deg)} }
      @keyframes scan { 0%{transform:translateY(-40px)} 100%{transform:translateY(100px)} }
      @keyframes dash { to{stroke-dashoffset:-40} }
      .d1{animation:pulse1 2.5s ease-in-out infinite}
      .d2{animation:pulse2 3s ease-in-out infinite}
      .d3{animation:pulse1 2s ease-in-out .3s infinite}
      .ring1{transform-origin:56px 50px; animation:orbit1 10s linear infinite}
      .ring2{transform-origin:56px 50px; animation:orbit2 7s linear infinite}
      .dash-line{stroke-dasharray:4 4; animation:dash .8s linear infinite}
    </style>
  </defs>

  <!-- Background -->
  <g clip-path="url(#bgClip)">
    <rect width="420" height="100" fill="#06060e" rx="12"/>
    <rect width="420" height="100" fill="url(#grid)" rx="12"/>
    <!-- Subtle radial -->
    <ellipse cx="56" cy="50" rx="120" ry="80" fill="url(#g3)" opacity="0.06"/>
  </g>

  <!-- === ICON MARK === -->
  <g transform="translate(8, 0)">
    <!-- Outer tech ring -->
    <circle cx="48" cy="50" r="30" stroke="url(#g1)" stroke-width="1.2" fill="none" class="ring1" opacity="0.5"/>
    <!-- Inner ring -->
    <circle cx="48" cy="50" r="21" stroke="url(#g2)" stroke-width="0.8" fill="none" class="ring2" opacity="0.35"/>
    <!-- Segmented ring -->
    <circle cx="48" cy="50" r="14" stroke="url(#g1)" stroke-width="1.5" fill="none" stroke-dasharray="8 6 4 6" opacity="0.6" filter="url(#glow2)"/>

    <!-- Stylized N mark - three interconnected lines -->
    <!-- Vertical left -->
    <line x1="38" y1="35" x2="38" y2="65" stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow2)"/>
    <!-- Diagonal -->
    <line x1="38" y1="35" x2="58" y2="65" stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow2)"/>
    <!-- Vertical right -->
    <line x1="58" y1="35" x2="58" y2="65" stroke="url(#g1)" stroke-width="2.5" stroke-linecap="round" filter="url(#glow2)"/>

    <!-- Connection nodes -->
    <circle cx="38" cy="35" r="2.5" fill="#00e5ff" filter="url(#glow1)"/>
    <circle cx="38" cy="65" r="2.5" fill="#7c3aed" filter="url(#glow1)"/>
    <circle cx="58" cy="35" r="2" fill="#0090ff" filter="url(#glow2)"/>
    <circle cx="58" cy="65" r="2" fill="#00e5ff" filter="url(#glow2)"/>

    <!-- Outer data nodes -->
    <circle cx="48" cy="20" r="1.8" fill="#00e5ff" class="d1" filter="url(#glow2)"/>
    <circle cx="76" cy="36" r="1.5" fill="#7c3aed" class="d2" filter="url(#glow2)"/>
    <circle cx="72" cy="64" r="1.8" fill="#0090ff" class="d3" filter="url(#glow2)"/>
    <circle cx="48" cy="80" r="1.5" fill="#00e5ff" class="d2" filter="url(#glow2)"/>
    <circle cx="20" cy="36" r="1.5" fill="#7c3aed" class="d1" filter="url(#glow2)"/>
    <circle cx="24" cy="64" r="1.8" fill="#0090ff" class="d3" filter="url(#glow2)"/>

    <!-- Connection lines to data nodes -->
    <line x1="48" y1="50" x2="48" y2="21.8" stroke="#00e5ff" stroke-width="0.5" opacity="0.15"/>
    <line x1="48" y1="50" x2="74.5" y2="37.5" stroke="#7c3aed" stroke-width="0.5" opacity="0.15"/>
    <line x1="48" y1="50" x2="70.5" y2="62.5" stroke="#0090ff" stroke-width="0.5" opacity="0.15"/>
    <line x1="48" y1="50" x2="48" y2="78.5" stroke="#00e5ff" stroke-width="0.5" opacity="0.15"/>
    <line x1="48" y1="50" x2="21.5" y2="37.5" stroke="#7c3aed" stroke-width="0.5" opacity="0.15"/>
    <line x1="48" y1="50" x2="25.5" y2="62.5" stroke="#0090ff" stroke-width="0.5" opacity="0.15"/>
  </g>

  <!-- === WORDMARK === -->
  <g transform="translate(98, 32)">
    <!-- Data bar accent -->
    <rect x="0" y="-2" width="3" height="42" rx="1.5" fill="url(#g1)" filter="url(#glow2)" opacity="0.7"/>

    <!-- NetStream text -->
    <text font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" letter-spacing="1.5">
      <tspan fill="url(#g1)" filter="url(#glowText)">Net</tspan>
    </text>

    <!-- Stream with lighter weight -->
    <text font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-weight="300" font-size="34" letter-spacing="2">
      <tspan fill="#7c3aed" x="82">Stream</tspan>
    </text>
  </g>

  <!-- Decorative bottom line -->
  <rect x="8" y="90" width="404" height="1" fill="url(#g1)" opacity="0.15" rx="0.5"/>
  <rect x="8" y="90" width="60" height="1" fill="url(#g1)" opacity="0.5" rx="0.5" filter="url(#glow2)"/>
  <circle cx="68" cy="90.5" r="2" fill="#00e5ff" filter="url(#glow1)"/>
</svg>
