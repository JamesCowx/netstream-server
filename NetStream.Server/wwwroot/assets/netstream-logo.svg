<svg xmlns="http://www.w3.org/2000/svg" width="320" height="80" fill="none" viewBox="0 0 320 80">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00c6ff"/>
      <stop offset="50%" stop-color="#0072ff"/>
      <stop offset="100%" stop-color="#6c3ce0"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6c3ce0"/>
      <stop offset="100%" stop-color="#00c6ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      @keyframes dash { to { stroke-dashoffset: 0; } }
      @keyframes pulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
      @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      .ring { animation: rotate 8s linear infinite; transform-origin: 32px 28px; }
      .ring2 { animation: rotate 6s linear reverse infinite; transform-origin: 32px 28px; }
      .dot { animation: pulse 2s ease-in-out infinite; }
      .dot:nth-child(2) { animation-delay: .4s; }
      .dot:nth-child(3) { animation-delay: .8s; }
    </style>
  </defs>
  <!-- Outer ring -->
  <circle cx="32" cy="28" r="23" stroke="url(#g1)" stroke-width="2.5" fill="none" class="ring" opacity="0.6"/>
  <!-- Inner ring -->
  <circle cx="32" cy="28" r="16" stroke="url(#g2)" stroke-width="2" fill="none" class="ring2" opacity="0.4"/>
  <!-- Center node -->
  <circle cx="32" cy="28" r="6" fill="url(#g1)" filter="url(#glow)"/>
  <!-- Orbiting dots -->
  <circle cx="32" cy="10" r="2.5" fill="#00c6ff" class="dot" opacity="0.8"/>
  <circle cx="50" cy="20" r="2" fill="#6c3ce0" class="dot" opacity="0.8"/>
  <circle cx="18" cy="44" r="2.5" fill="#0072ff" class="dot" opacity="0.8"/>
  <!-- Connecting lines -->
  <line x1="32" y1="28" x2="32" y2="12.5" stroke="#00c6ff" stroke-width="1" opacity="0.3"/>
  <line x1="32" y1="28" x2="48" y2="22" stroke="#6c3ce0" stroke-width="1" opacity="0.3"/>
  <line x1="32" y1="28" x2="20.5" y2="42" stroke="#0072ff" stroke-width="1" opacity="0.3"/>
  <!-- Text: NetStream -->
  <text x="85" y="47" font-family="'Segoe UI',Arial,Helvetica,sans-serif" font-weight="800" font-size="34" letter-spacing="1.5">
    <tspan fill="url(#g1)" filter="url(#glow)">Net</tspan><tspan fill="#6c3ce0" font-weight="600">Stream</tspan>
  </text>
</svg>
